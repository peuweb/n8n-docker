services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: always
    environment:
      # Database type configuration
      - DB_TYPE=${DB_TYPE:-sqlite}
      
      # General database settings
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-n8n}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Connection URL (for MongoDB or special connections)
      - DB_CONNECTION_URL=${DB_CONNECTION_URL}
      
      # SQLite path
      - DB_SQLITE_PATH=${DB_SQLITE_PATH:-/home/node/.n8n/database.sqlite}

      # Task Runners
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE:-internal}
      - N8N_RUNNERS_TIMEOUT=${N8N_RUNNERS_TIMEOUT:-60}
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      - N8N_RUNNERS_BROKER_PORT=${N8N_RUNNERS_BROKER_PORT:-5679}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}

      # Authentication settings
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      
      # Security settings
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Other settings
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      
    ports:
      - ${N8N_PORT:-5678}:5678
      - ${N8N_RUNNERS_BROKER_PORT:-5679}:5679
    # volumes:
    #   - ./.n8n:/home/node/.n8n
