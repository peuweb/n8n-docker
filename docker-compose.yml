services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: always
    network_mode: ${NETWORK_MODE:-bridge}
    environment:
      # Port configuration (these are the ports n8n will listen on)
      - N8N_PORT=${INTERNAL_PORT:-5678}
      - N8N_RUNNERS_BROKER_PORT=${INTERNAL_BROKER_PORT:-5679}
      
      # Database configuration
      - DB_TYPE=${DB_TYPE:-sqlite}
      
      # PostgreSQL specific settings
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      
      # MySQL specific settings
      - DB_MYSQLDB_HOST=${DB_MYSQLDB_HOST:-mysql}
      - DB_MYSQLDB_PORT=${DB_MYSQLDB_PORT:-3306}
      - DB_MYSQLDB_DATABASE=${DB_MYSQLDB_DATABASE:-n8n}
      - DB_MYSQLDB_USER=${DB_MYSQLDB_USER:-root}
      - DB_MYSQLDB_PASSWORD=${DB_MYSQLDB_PASSWORD}
      
      # MongoDB specific settings
      - DB_MONGODB_CONNECTION_URL=${DB_MONGODB_CONNECTION_URL}
      
      # SQLite specific settings
      - DB_SQLITE_PATH=${DB_SQLITE_PATH:-/home/node/.n8n/database.sqlite}
      
      # Task Runners
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE:-internal}
      - N8N_RUNNERS_TIMEOUT=${N8N_RUNNERS_TIMEOUT:-60}
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}

      # Authentication settings
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      
      # Security settings
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Other settings
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    ports:
      - "${EXTERNAL_PORT:-5678}:${INTERNAL_PORT:-5678}"
      - "${EXTERNAL_BROKER_PORT:-5679}:${INTERNAL_BROKER_PORT:-5679}"
    profiles:
      - bridge-mode
    #volumes:
    #  - ./.n8n:/home/node/.n8n
